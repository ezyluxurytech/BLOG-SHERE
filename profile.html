<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | BlogSphere</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-nav">
        <a href="index.html" class="brand">
          <span class="brand-mark">B</span>
          <span>BlogSphere</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="search.html" class="nav-link">Explore</a>
          <a href="categories.html" class="nav-link">Categories</a>
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="profile.html" class="nav-link active">Profile</a>
        </nav>
        <div class="nav-actions" id="navActions"></div>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="page-header">
          <h1>Your profile</h1>
          <p>Manage your public profile and update your details.</p>
        </div>

        <div class="profile-grid" style="margin-bottom: 32px;">
          <div class="profile-card" style="padding: 24px;">
            <div id="profileIdentity" style="display: flex; flex-direction: column; gap: 12px;"></div>
          </div>

          <div class="profile-card" style="padding: 24px;">
            <form id="profileForm" class="form-grid">
              <div class="form-group">
                <label for="profileFullName">Full name</label>
                <input id="profileFullName" name="full_name" type="text" required />
              </div>

              <div class="form-group">
                <label for="profileUsername">Username</label>
                <input id="profileUsername" name="username" type="text" required />
              </div>

              <div class="form-group full">
                <label for="profileBio">Bio</label>
                <textarea id="profileBio" name="bio" rows="4" placeholder="Tell readers a little about yourself..."></textarea>
              </div>

              <div class="form-group full">
                <label for="profileAvatar">Avatar image</label>
                <input id="profileAvatar" type="file" accept="image/*" />
              </div>

              <div class="form-actions full">
                <button type="submit" class="btn btn-primary">Update profile</button>
              </div>
            </form>
          </div>
        </div>

        <div class="section-header">
          <h2 class="section-title" style="font-size: 2rem;">Published posts</h2>
        </div>
        <div id="userPostsContainer" class="posts-grid"></div>
      </div>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
