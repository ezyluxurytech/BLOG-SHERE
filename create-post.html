<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post | BlogSphere</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-nav">
        <a href="index.html" class="brand">
          <span class="brand-mark">B</span>
          <span>BlogSphere</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="search.html" class="nav-link">Explore</a>
          <a href="categories.html" class="nav-link">Categories</a>
          <a href="index.html#about" class="nav-link">About</a>
          <a href="search.html" class="nav-link">Search</a>
        </nav>
        <div class="nav-actions" id="navActions"></div>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="page-header">
          <h1>Create a post</h1>
          <p>Share something useful, insightful or inspiring with the BlogSphere community.</p>
        </div>

        <form id="createPostForm" class="form-grid">
          <div class="form-group full">
            <label for="postTitle">Title</label>
            <input id="postTitle" name="title" type="text" placeholder="Post title" required />
          </div>

          <div class="form-group">
            <label for="postCategory">Category</label>
            <select id="postCategory" name="category_id" required></select>
          </div>

          <div class="form-group">
            <label for="postStatus">Status</label>
            <select id="postStatus" name="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>

          <div class="form-group full">
            <label for="postExcerpt">Excerpt</label>
            <textarea id="postExcerpt" name="excerpt" rows="3" placeholder="A short summary of your article" required></textarea>
          </div>

          <div class="form-group full">
            <label for="postContent">Content</label>
            <textarea id="postContent" name="content" rows="10" placeholder="Write your article here..." required></textarea>
          </div>

          <div class="form-group full">
            <label for="featuredImage">Featured image</label>
            <input id="featuredImage" type="file" accept="image/*" />
          </div>

          <div class="form-actions full">
            <button type="submit" class="btn btn-primary" data-mode="draft">Save Draft</button>
            <button type="submit" class="btn btn-secondary" data-mode="published">Publish</button>
          </div>
        </form>
      </div>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
