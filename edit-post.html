<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Post | BlogSphere</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-nav">
        <a href="index.html" class="brand">
          <span class="brand-mark">B</span>
          <span>BlogSphere</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="search.html" class="nav-link">Explore</a>
          <a href="categories.html" class="nav-link">Categories</a>
          <a href="index.html#about" class="nav-link">About</a>
          <a href="search.html" class="nav-link">Search</a>
        </nav>
        <div class="nav-actions" id="navActions"></div>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="page-header">
          <h1>Edit post</h1>
          <p>Update your article and publish changes when ready.</p>
        </div>

        <form id="editPostForm" class="form-grid">
          <div class="form-group full">
            <label for="editTitle">Title</label>
            <input id="editTitle" name="title" type="text" required />
          </div>

          <div class="form-group">
            <label for="editCategory">Category</label>
            <select id="editCategory" name="category_id" required></select>
          </div>

          <div class="form-group">
            <label for="editStatus">Status</label>
            <select id="editStatus" name="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>

          <div class="form-group full">
            <label for="editExcerpt">Excerpt</label>
            <textarea id="editExcerpt" name="excerpt" rows="3" required></textarea>
          </div>

          <div class="form-group full">
            <label for="editContent">Content</label>
            <textarea id="editContent" name="content" rows="10" required></textarea>
          </div>

          <div class="form-group full">
            <label for="editFeaturedImage">Featured image</label>
            <input id="editFeaturedImage" type="file" accept="image/*" />
          </div>

          <div class="form-actions full">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
