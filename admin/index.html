<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | BlogSphere</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-nav">
        <a href="../index.html" class="brand">
          <span class="brand-mark">B</span>
          <span>BlogSphere</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="../index.html" class="nav-link">Home</a>
          <a href="../search.html" class="nav-link">Explore</a>
          <a href="index.html" class="nav-link active">Admin</a>
          <a href="users.html" class="nav-link">Users</a>
          <a href="posts.html" class="nav-link">Posts</a>
          <a href="comments.html" class="nav-link">Comments</a>
        </nav>
        <div class="nav-actions" id="navActions"></div>
      </div>
    </header>

    <main class="section">
      <div class="container admin-layout">
        <div class="page-header">
          <h1>Administration</h1>
          <p>Monitor platform activity and manage community content.</p>
        </div>

        <div class="admin-grid">
          <div class="admin-panel"><h3>Total Users</h3><div class="value" id="adminTotalUsers">0</div></div>
          <div class="admin-panel"><h3>Total Posts</h3><div class="value" id="adminTotalPosts">0</div></div>
          <div class="admin-panel"><h3>Published Posts</h3><div class="value" id="adminPublishedPosts">0</div></div>
          <div class="admin-panel"><h3>Draft Posts</h3><div class="value" id="adminDraftPosts">0</div></div>
          <div class="admin-panel"><h3>Total Comments</h3><div class="value" id="adminTotalComments">0</div></div>
          <div class="admin-panel"><h3>Total Likes</h3><div class="value" id="adminTotalLikes">0</div></div>
        </div>
      </div>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
